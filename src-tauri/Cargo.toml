[package]
name = "lifemind"
version = "0.2.5"
description = "Obsidian knowledge intake review desktop app"
authors = ["lifemind"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "lifemind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["custom-protocol"] }
tauri-plugin-log = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "system-proxy", "gzip", "brotli", "deflate", "zstd"] }
pdf-extract = "0.12"
lopdf = { version = "0.42", default-features = false }
png = { version = "0.18.1", default-features = false }
keyring = { version = "3.6.3", features = ["apple-native"] }
